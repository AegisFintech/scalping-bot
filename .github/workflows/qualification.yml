name: Release qualification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib openssl
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: npm run qualify
      - name: Retain isolated test failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-failure-${{ github.run_id }}
          path: |
            /tmp/scalper-qualification-*/checks/python-tests.log
            /tmp/scalper-qualification-*/checks/results.json
          retention-days: 7
          if-no-files-found: ignore
