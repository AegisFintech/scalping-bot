name: Signed research publisher
on:
  workflow_dispatch:
    inputs:
      request:
        description: Canonical payload and protected-parent SSH signature
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trusted-research-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'AegisWalletApp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
      - name: Install trusted publisher and AST tool
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          python -m venv /tmp/graphify
          /tmp/graphify/bin/pip install -r requirements.graphify.lock
          .venv/bin/pip-audit --disable-pip --no-deps -r requirements.graphify.lock
          echo /tmp/graphify/bin >> "$GITHUB_PATH"
          node scripts/install-git-hooks.mjs
      - name: Publish signed research as draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          .venv/bin/python -m python.operations.research_publisher
